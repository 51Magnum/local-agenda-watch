name: Refresh configured jurisdictions
on:
  schedule:
    # Two weekday refreshes; metadata collection does not take the live document lease.
    - cron: '45 13,21 * * 1-5'
  workflow_dispatch:
    inputs:
      resume_area:
        description: 'Explicitly resume this paused area after current checks pass; leave blank for normal refresh'
        type: string
        default: ''
  push:
    branches: [main]
permissions: {}
concurrency:
  group: configured-jurisdiction-ingestion
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the merged Git deployment
        if: github.event_name == 'push' || inputs.resume_area != ''
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            actual=$(curl --fail --silent --max-time 15 https://www.localagendawatch.com/api/version | jq -r '.commit // empty') || actual=''
            if [ "$actual" = "$EXPECTED_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo '::error::Production has not built the merged Git commit; collection was not started.'
          exit 1
      - name: Refresh registry-enabled adapters and apply automatic self-check gates
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESUME_AREA: ${{ inputs.resume_area }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.localagendawatch.com/api/cron/jurisdictions
          AREAS=$(curl --fail-with-body --silent --show-error --max-time 30 --header "Authorization: Bearer $CRON_SECRET" "$BASE?scope=configured" | jq -r '.areas[]')
          if [ -n "$RESUME_AREA" ]; then
            found=0
            for area in $AREAS; do if [ "$area" = "$RESUME_AREA" ]; then found=1; fi; done
            if [ "$found" -ne 1 ]; then echo '::error::Resume area must be registry-enabled'; exit 1; fi
          fi
          failed=0
          for area in $AREAS; do
            if [ -n "$RESUME_AREA" ] && [ "$area" != "$RESUME_AREA" ]; then continue; fi
            echo "Refreshing $area"
            area_ok=1
            # Collection and self-check each have a separate server budget below 300s.
            # Continue to other areas when one official source is unavailable.
            for command in collect check; do
              attempts=4
              phase_ok=0
              for attempt in $(seq 1 "$attempts"); do
                if ! curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 270 \
                  --header "Authorization: Bearer $CRON_SECRET" "$BASE?command=$command&area=$area&days=90" > result.json; then
                  echo "::error::$area $command failed; previous published data retained"
                  cat result.json
                  break
                fi
                jq '{areaId,complete,passRate,goLive,applications:(.applications // []|length),queue:(.queue // []|length),verificationPending,documentsPending,collectionProgress}' result.json
                if [ "$command" = collect ] && [ "$(jq -r '.complete' result.json)" != true ]; then
                  if jq -e 'any(.health[]?; .state == "blocked")' result.json >/dev/null; then
                    echo "::warning::$area official source is blocked; no immediate retry or bypass"
                    break
                  fi
                  echo "$area collection is unfinished; private progress retained (pass $attempt/$attempts)"
                  continue
                fi
                if [ "$command" = check ] && { [ "$(jq -r '.verificationPending // 0' result.json)" -gt 0 ] || { [ "$attempt" -lt "$attempts" ] && [ "$(jq -r '.documentsPending // 0' result.json)" -gt 0 ]; }; }; then
                  echo "$area source verification is unfinished; verified evidence retained (pass $attempt/$attempts)"
                  continue
                fi
                phase_ok=1
                break
              done
              if [ "$phase_ok" -ne 1 ]; then
                echo "::error::$area $command did not finish; publication checks were not advanced"
                failed=1
                area_ok=0
                break
              fi
            done
            # Report publication state separately: passing QA does not clear a durable pause.
            if ! curl --fail-with-body --silent --show-error --max-time 30 --header "Authorization: Bearer $CRON_SECRET" "$BASE?command=status&area=$area" > status.json; then
              echo "::error::$area publication status unavailable"; failed=1; continue
            fi
            jq '{areaId,status,publiclyVisible,checksPassed,canResume,publishedRecords,reason}' status.json
            if [ "$RESUME_AREA" = "$area" ]; then
              if [ "$area_ok" -ne 1 ]; then echo "::error::$area fresh checks failed; resume was not attempted"; continue; fi
              if ! curl --fail-with-body --silent --show-error --max-time 120 --header "Authorization: Bearer $CRON_SECRET" "$BASE?command=resume&area=$area" > resume.json; then
                echo "::error::$area resume refused; publication gates were retained"; cat resume.json; failed=1; continue
              fi
              jq '{areaId,status,publiclyVisible,publishedRecords,reason}' resume.json
            fi
          done
          exit "$failed"
