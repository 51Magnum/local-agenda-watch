name: Refresh configured jurisdictions
on:
  schedule:
    # Two weekday refreshes; metadata collection does not take the live document lease.
    - cron: '45 13,21 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: configured-jurisdiction-ingestion
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the merged Git deployment
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            actual=$(curl --fail --silent --max-time 15 https://www.localagendawatch.com/api/version | jq -r '.commit // empty') || actual=''
            if [ "$actual" = "$EXPECTED_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo '::error::Production has not built the merged Git commit; collection was not started.'
          exit 1
      - name: Refresh registry-enabled adapters and apply automatic self-check gates
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.localagendawatch.com/api/cron/jurisdictions
          AREAS=$(curl --fail-with-body --silent --show-error --max-time 30 --header "Authorization: Bearer $CRON_SECRET" "$BASE?scope=configured" | jq -r '.areas[]')
          for area in $AREAS; do
            curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 290 --retry 3 --retry-delay 60 --retry-all-errors \
              --header "Authorization: Bearer $CRON_SECRET" "$BASE?command=backfill&area=$area&days=90" > result.json
            jq '{areaId,complete,applications:(.applications|length),meetings:(.meetings|length),blocked:[.health[]|select(.state=="blocked")],skipped:(.skipped|length)}' result.json
          done
