name: Daily project alerts
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  digest:
    if: ${{ vars.ALERTS_DELIVERY_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deliver confirmed project digests
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail-with-body --max-time 300 -H "Authorization:Bearer $CRON_SECRET" https://www.localagendawatch.com/api/cron/alerts
