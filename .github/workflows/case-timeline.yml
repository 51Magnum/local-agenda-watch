name: Refresh case timelines
on:
  schedule:
    # Cover both Denver windows in MST and MDT. Extra edge hours are harmless 200 skips.
    - cron: '0,20,40 11-16 * * *'
    - cron: '0,20,40 20-23,0-1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the time window and force a full source sweep'
        type: boolean
        default: false
      discovery_only:
        description: 'Refresh sources and native case records without AI document extraction'
        type: boolean
        default: false
      site_url:
        description: "Production or this repository's Vercel preview URL"
        type: string
        default: 'https://www.localagendawatch.com'
permissions: {}
concurrency:
  group: case-timeline-ingestion
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Invoke meeting-aware scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ inputs.site_url || 'https://www.localagendawatch.com' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          FORCE_FULL_SWEEP: ${{ inputs.force || false }}
          DISCOVERY_ONLY: ${{ inputs.discovery_only || false }}
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is missing; no sweep ran."
            exit 1
          fi
          if ! [[ "$SITE_URL" =~ ^https://(www\.localagendawatch\.com|local-agenda-watch-[a-z0-9-]+-shane-s-projects-e4093d06\.vercel\.app)/?$ ]]; then
            echo "::error::Only the official production site or repository previews are allowed."
            exit 1
          fi
          QUERY=""
          if [ "$MANUAL" = "true" ]; then
            QUERY="?manual=1"
            if [ "$FORCE_FULL_SWEEP" = "true" ]; then QUERY="$QUERY&force=1"; fi
            if [ "$DISCOVERY_ONLY" = "true" ]; then QUERY="$QUERY&discoveryOnly=1"; fi
          fi
          curl --output response.json --fail-with-body --silent --show-error --connect-timeout 15 --max-time 330 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/case-timeline$QUERY"

          cat response.json
          jq -e '(.status == "completed") or (.status == "skipped")' response.json || {
            echo "::error::Scheduler returned an unexpected status; inspect the reason above."
            exit 1
          }
      - name: Preserve scheduler run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-sweep-result
          path: response.json
          if-no-files-found: ignore
